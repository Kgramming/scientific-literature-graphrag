[project]
name = "scientific-literature-graphrag"
version = "0.1.0"
description = "GraphRAG for scientific literature — advanced biomedical research QA (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keval Shah" }]
dependencies = [
    "sentence-transformers>=2.2",
    "scispacy>=0.5.4",
    "spacy>=3.7",
    "hdbscan>=0.8",
    "scikit-learn>=1.3",
    "neo4j>=5.0",
    "datasets>=2.14",
    "streamlit>=1.32",
    "pyvis>=0.3",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "rapidfuzz>=3.0",
    "groq>=0.9",
    "openai>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Neo4j instance",
    "e2e: needs Neo4j and an LLM API key",
]
