# Neo4j 5 with APOC + GDS for the Scientific Literature GraphRAG project.
# Usage: docker compose up -d   (then set SGRAG_NEO4J_* in your .env)
# NOTE: pin the exact image tag after the first successful pull in Phase 0.
services:
  neo4j:
    image: neo4j:5.26.0
    container_name: sgrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${SGRAG_NEO4J_USER:-neo4j}/${SGRAG_NEO4J_PASSWORD:-sgrag-dev-password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH##*/} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
