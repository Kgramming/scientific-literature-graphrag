# Phase 2 chunking pilot — explicit, repeatable configuration.
# The same file (with a different corpus path) runs the 5000-abstract corpus later.
experiment:
  name: phase2_chunking_pilot
  corpus: data/processed/pilot_corpus.jsonl
  out_dir: data/processed

strategies:
  fixed_token:
    token_limit: 256
    overlap: 32
    tokenizer_model: sentence-transformers/all-MiniLM-L6-v2
  sentence_boundary:
    max_tokens: 256
    tokenizer_model: sentence-transformers/all-MiniLM-L6-v2
  semantic_cluster:
    embedding_model: all-MiniLM-L6-v2
    clustering: hdbscan
    min_cluster_size: 2
    metric: euclidean
    min_sentences: 3
    max_tokens: 256
    tokenizer_model: sentence-transformers/all-MiniLM-L6-v2

evaluation:
  coherence_model: all-MiniLM-L6-v2
  out_dir: results/phase2_chunking
