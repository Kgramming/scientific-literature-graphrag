# Phase 4 hybrid retrieval configuration.
#
# All expansion is bounded for the 53,091-chunk graph:
#   - vector_top_k chunks from the Neo4j vector index
#   - entity_top_k chunks per query entity via MENTIONS
#   - entities with mention-degree > hub_degree_cap are SKIPPED entirely
#   - semantic_similar_top_k outgoing edges per vector hit (Phase 3B rule <= 5)
#   - max_candidates caps the final fused list
#
# Neo4j password comes from SGRAG_NEO4J_PASSWORD (never stored here).

vector_top_k: 20
entity_top_k: 15
semantic_similar_top_k: 3
graph_hop_limit: 1
hub_degree_cap: 1000
max_candidates: 100
min_vector_score: 0.0

embedding_model: all-MiniLM-L6-v2
entity_model: en_ner_bc5cdr_md
vector_index_name: chunk_embedding_idx

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  database: neo4j

fusion:
  method: weighted   # weighted | rrf
  weight_vector: 0.6
  weight_entity: 0.25
  weight_semantic: 0.15
  rrf_k: 60
